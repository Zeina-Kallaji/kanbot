<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Circular Blue Background -->
  <circle cx="250" cy="250" r="250" fill="#3157B2" />

  <!-- Robot Group (Original Proportions & Curves Preserved) -->
  <g transform="translate(0, 5)">
    <!-- Antenna Ball -->
    <circle cx="250" cy="95" r="20" fill="#2ECC71" />
    
    <!-- Antenna Stem -->
    <rect x="242" y="112" width="16" height="32" fill="#FFFFFF" rx="8" />

    <!-- Left Ear -->
    <rect x="95" y="215" width="28" height="70" rx="14" fill="#FFFFFF" />
    
    <!-- Right Ear -->
    <rect x="377" y="215" width="28" height="70" rx="14" fill="#FFFFFF" />

    <!-- Outer Robot Head (White) -->
    <rect x="110" y="135" width="280" height="230" rx="80" fill="#FFFFFF" />

    <!-- Screen Area (Blue) -->
    <rect x="150" y="175" width="200" height="150" rx="50" fill="#3157B2" />

    <!-- KanBan Bars (White & Green) -->
    <!-- Bar 1 (Left) -->
    <rect x="180" y="205" width="28" height="90" rx="14" fill="#FFFFFF" />
    
    <!-- Bar 2 (Middle) -->
    <rect x="226" y="205" width="28" height="65" rx="14" fill="#FFFFFF" />
    
    <!-- Bar 3 (Right - Green Active State) -->
    <rect x="272" y="205" width="28" height="38" rx="12" fill="#2ECC71" />
  </g>
</svg>